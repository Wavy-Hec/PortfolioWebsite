  <!-- The résumé renders as an image so it always displays inline (a browser set
       to "download PDFs" — common on macOS — can't be forced to render a PDF in
       an <object>/<iframe>). Every clickable region from the PDF is re-created as
       a positioned <a> over the image, so hover + links still work. Rect
       percentages are generated from the PDF's own link annotations, so they
       track the page exactly at any zoom. Regenerate both when the PDF changes. -->
  <style>
    :root {
      --bg: #0b1020; --panel: #0e1428; --border: #23305c;
      --ink: #6f9cf0; --ink-strong: #a9c4fb; --text: #cdd8f2; --muted: #8a97bd;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      min-height: 100vh; background: var(--bg); color: var(--text);
      font-family: 'Share Tech Mono', ui-monospace, 'Cascadia Mono', Consolas, monospace;
    }
    header {
      position: sticky; top: 0; z-index: 3;
      display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
      padding: 12px 18px; background: var(--panel); border-bottom: 1px solid var(--border);
    }
    .title { font-size: 15px; letter-spacing: 1px; text-transform: uppercase; color: var(--muted); margin-right: auto; }
    .title b { color: var(--ink-strong); }
    a.act, a.act:visited {
      font-size: 13px; letter-spacing: .5px; text-decoration: none;
      padding: 8px 16px; border-radius: 5px;
      border: 1px solid var(--border); color: var(--text); background: transparent;
      transition: border-color .15s, color .15s, background .15s;
    }
    a.act:hover { border-color: var(--ink); color: var(--ink-strong); }
    a.primary { background: var(--ink); border-color: var(--ink); color: #08101f; font-weight: bold; }
    a.primary:hover { background: var(--ink-strong); border-color: var(--ink-strong); color: #08101f; }
    main { padding: 24px 16px 40px; display: flex; justify-content: center; }
    /* the sheet is the positioning context for the link overlay */
    .sheet {
      position: relative; width: 100%; max-width: 850px;
      border: 1px solid var(--border); border-radius: 6px;
      box-shadow: 0 12px 40px rgba(0, 0, 0, .45);
      background: #fff; overflow: hidden;
    }
    .sheet img { width: 100%; height: auto; display: block; }
    /* link hotspots, positioned in % so they scale with the image */
    .lk {
      position: absolute; display: block; border-radius: 2px;
      text-decoration: none; cursor: pointer;
      background: rgba(47, 84, 204, 0);
      box-shadow: 0 0 0 0 rgba(47, 84, 204, 0);
      transition: background .12s ease, box-shadow .12s ease;
    }
    .lk:hover, .lk:focus-visible {
      background: rgba(47, 84, 204, .16);
      box-shadow: 0 0 0 2px rgba(47, 84, 204, .45);
      outline: none;
    }
    @media (prefers-reduced-motion: reduce) { .lk { transition: none; } }
    .hint { text-align: center; color: var(--muted); font-size: 12.5px; letter-spacing: .5px; padding: 0 16px 28px; }
  </style>
</head>
