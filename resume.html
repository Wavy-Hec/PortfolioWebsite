<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <title>Résumé — Hector Lugo</title>
  <link rel="icon" href="favicon-32.png" type="image/png" sizes="32x32">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <!-- Résumé is shown as an IMAGE, not an embedded PDF: a browser set to
       "download PDFs" (common on macOS) can't be forced to render a PDF inline
       via <object>/<iframe>, but an <img> always displays in every browser.
       The real PDF stays one click away via Download, as a deliberate choice. -->
  <style>
    :root {
      --bg: #0b1020; --panel: #0e1428; --border: #23305c;
      --ink: #6f9cf0; --ink-strong: #a9c4fb; --text: #cdd8f2; --muted: #8a97bd;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      min-height: 100vh; background: var(--bg); color: var(--text);
      font-family: 'Share Tech Mono', ui-monospace, 'Cascadia Mono', Consolas, monospace;
    }
    header {
      position: sticky; top: 0; z-index: 2;
      display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
      padding: 12px 18px; background: var(--panel); border-bottom: 1px solid var(--border);
    }
    .title { font-size: 15px; letter-spacing: 1px; text-transform: uppercase; color: var(--muted); margin-right: auto; }
    .title b { color: var(--ink-strong); }
    a.act, a.act:visited {
      font-size: 13px; letter-spacing: .5px; text-decoration: none;
      padding: 8px 16px; border-radius: 5px;
      border: 1px solid var(--border); color: var(--text); background: transparent;
      transition: border-color .15s, color .15s, background .15s;
    }
    a.act:hover { border-color: var(--ink); color: var(--ink-strong); }
    a.primary { background: var(--ink); border-color: var(--ink); color: #08101f; font-weight: bold; }
    a.primary:hover { background: var(--ink-strong); border-color: var(--ink-strong); color: #08101f; }
    main { padding: 24px 16px; display: flex; justify-content: center; }
    .sheet {
      width: 100%; max-width: 850px; height: auto; display: block;
      border: 1px solid var(--border); border-radius: 6px;
      box-shadow: 0 12px 40px rgba(0, 0, 0, .45);
      background: #fff;
    }
  </style>
</head>
<body>
  <header>
    <span class="title">HECTOR LUGO — <b>RÉSUMÉ</b></span>
    <a class="act" href="./">&larr; Portfolio</a>
    <a class="act primary" href="Hector_Lugo_Resume_Summer.pdf" download>Download PDF</a>
  </header>
  <main>
    <img class="sheet" src="resume-page1.png"
         alt="Résumé of Hector Lugo — AI/ML research intern, M.S. Computer Science at UTRGV"
         width="1224" height="1584" decoding="async">
  </main>
</body>
</html>
