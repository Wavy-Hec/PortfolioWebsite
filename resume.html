<head>

  <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@400&family=Share+Tech+Mono&display=swap"></noscript>
  <!-- the résumé is shown as an image, because a browser set to download PDFs will not show one inline;
       the PDF's links are laid over it as hotspots (tools/build-resume-view.py) -->
  <style>
    :root {
      --paper: #e9e7e2;
      --sumi: #141416;
      --deep: #0b0b0d;
      --dim: #bab8b3;
      --rule: rgba(233, 231, 226, 0.18);
      --rule-strong: rgba(233, 231, 226, 0.3);
      --serif: 'Shippori Mincho', 'Noto Serif JP', 'Yu Mincho', Georgia, serif;
      --mono: 'Share Tech Mono', ui-monospace, Menlo, Consolas, monospace;
      --gutter: clamp(16px, 6.7vw, 96px);
    }
    * {
      box-sizing: border-box;
    }
    html {
      background: var(--sumi);
      color-scheme: dark;
    }
    body {
      margin: 0;
      min-height: 100vh;
      background: var(--sumi);
      color: var(--paper);
      font: 400 16px/1.6 var(--serif);
      -webkit-font-smoothing: antialiased;
    }
    body::after {
      content: '';
      position: fixed;
      inset: 0;
      z-index: 50;
      pointer-events: none;
      opacity: 0.1;
      background-size: 256px 256px;
      background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='256' height='256'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.8' numOctaves='3' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .914  0 0 0 0 .906  0 0 0 0 .886  2.2 0 0 0 -.6'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
    }
    a {
      color: inherit;
      text-decoration: none;
    }
    :focus-visible {
      outline: 2px solid var(--paper);
      outline-offset: 3px;
    }
    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      margin: -1px;
      padding: 0;
      overflow: hidden;
      clip-path: inset(50%);
      white-space: nowrap;
      border: 0;
    }
    .defs {
      position: absolute;
      width: 0;
      height: 0;
      overflow: hidden;
    }
    .seal {
      display: inline-block;
      flex: none;
      width: 32px;
      height: 32px;
    }

    .nav {
      position: sticky;
      top: 0;
      z-index: 3;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      height: 60px;
      padding: 0 var(--gutter);
      background: var(--sumi);
      border-bottom: 1px solid var(--rule);
    }
    .wordmark {
      display: inline-flex;
      align-items: center;
      gap: 14px;
      padding: 4px 0;
      font-size: 13px;
      letter-spacing: 0.2em;
      text-transform: uppercase;
    }
    .wordmark .wm {
      white-space: nowrap;
    }
    .acts {
      display: flex;
      align-items: center;
      gap: 28px;
    }
    .act {
      display: inline-block;
      padding: 12px 0;
      margin: -12px 0;
      font-family: var(--mono);
      font-size: 12px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--dim);
      white-space: nowrap;
    }
    .act:hover,
    .act:focus-visible {
      color: var(--paper);
      text-decoration: underline;
      text-underline-offset: 6px;
      text-decoration-thickness: 1px;
    }
    .act.dl {
      padding: 12px 8px;
      margin: -12px -8px;
      color: var(--paper);
      outline: 2px solid transparent;
      outline-offset: -1px;
    }
    .act.dl:hover,
    .act.dl:focus-visible {
      outline-color: var(--paper);
      text-decoration: none;
    }

    main {
      padding: 56px var(--gutter) 0;
    }
    .scroll {
      display: flex;
      justify-content: center;
      padding-bottom: 32px;
    }
    .sheet {
      position: relative;
      flex: none;
      width: 100%;
      max-width: 850px;
      margin-right: 13px;
      background: var(--paper);
      border: 1px solid var(--rule-strong);
      box-shadow:
        12px 12px 0 var(--deep),
        13px 13px 0 var(--rule);
    }
    .sheet img {
      display: block;
      width: 100%;
      height: auto;
      mix-blend-mode: multiply;
    }
    /* one hotspot per link in the PDF, placed in percent of the page */
    .lk {
      position: absolute;
      display: block;
      background: rgba(20, 20, 22, 0);
      box-shadow: 0 0 0 0 rgba(20, 20, 22, 0);
      transition:
        background 0.12s ease,
        box-shadow 0.12s ease;
    }
    .lk:hover,
    .lk:focus-visible {
      background: rgba(20, 20, 22, 0.08);
      box-shadow: 0 0 0 2px rgba(20, 20, 22, 0.7);
      outline: none;
    }
    /* two links on adjacent lines: each grows away from the other to a 24 px target */
    .lk.up,
    .lk.down {
      min-height: 24px;
    }
    .hint {
      margin: 0;
      padding: 0 0 56px;
      font-family: var(--mono);
      font-size: 11px;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      text-align: center;
      color: var(--dim);
    }
    .hint a {
      display: inline-block;
      padding: 12px 0;
      margin: -12px 0;
      color: var(--paper);
      text-decoration: underline;
      text-underline-offset: 5px;
      text-decoration-thickness: 1px;
    }
    .hint .ph,
    .hint .tab {
      display: none;
    }

    /* a touch tablet: the sheet fits but its text is small, so the hint comes first */
    @media (pointer: coarse) and (min-width: 721px) {
      main {
        display: flex;
        flex-direction: column;
      }
      .hint {
        order: -1;
        padding: 0 0 20px;
      }
      .hint .desk {
        display: none;
      }
      .hint .tab {
        display: inline;
      }
    }
    /* a phone: the sheet keeps a readable width and scrolls sideways */
    @media (max-width: 720px) {
      .nav {
        height: 56px;
      }
      .wordmark {
        gap: 10px;
        padding: 7px;
        margin: -7px;
      }
      .wordmark .seal {
        width: 26px;
        height: 26px;
      }
      .wordmark .wm {
        position: absolute;
        width: 1px;
        height: 1px;
        overflow: hidden;
        clip-path: inset(50%);
      }
      .acts {
        gap: 16px;
      }
      .act {
        font-size: 11px;
      }
      main {
        display: flex;
        flex-direction: column;
        padding: 16px 0 0;
      }
      .scroll {
        justify-content: flex-start;
        padding: 0 var(--gutter) 28px;
        overflow-x: auto;
        overscroll-behavior-x: contain;
      }
      .sheet {
        width: 760px;
        max-width: none;
        margin-right: 9px;
        box-shadow:
          8px 8px 0 var(--deep),
          9px 9px 0 var(--rule);
      }
      .hint {
        order: -1;
        padding: 0 var(--gutter) 12px;
        letter-spacing: 0.14em;
        line-height: 2;
      }
      .hint .desk {
        display: none;
      }
      .hint .ph {
        display: inline;
      }
    }
    /* finger-sized hit areas; neighbours each keep their own half of the gap */
    @media (pointer: coarse) {
      .lk::after {
        content: '';
        position: absolute;
        inset: -14px -6px;
      }
      .lk.up::after {
        top: -28px;
        bottom: 0;
      }
      .lk.down::after {
        top: 0;
        bottom: -28px;
      }
      .lk.lft::after {
        left: -12px;
        right: 0;
      }
      .lk.rgt::after {
        left: 0;
        right: -12px;
      }
    }
    @media (prefers-reduced-motion: reduce) {
      .lk {
        transition: none;
      }
    }
  </style>
</head>

  <script>
    // on a phone the sheet opens centred on its header: the whole name, not a cropped one
    if (matchMedia('(max-width: 720px)').matches) {
      const scroller = document.querySelector('.scroll');
      const sheet = scroller.querySelector('.sheet');
      scroller.scrollLeft = sheet.offsetLeft + sheet.offsetWidth / 2 - scroller.clientWidth / 2;
    }
  </script>
