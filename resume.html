  <!-- The résumé renders as an image so it always displays inline (a browser set to "download PDFs" — common on macOS — can't be forced to
       render a PDF in an <object>/<iframe>). Every clickable region from the PDF is re-created as a positioned <a> over the image, so hover
       + links still work. Rect percentages are generated from the PDF's own link annotations, so they track the page exactly at any zoom.
       Regenerate both when the PDF changes (tools/build-resume-view.py).
       The night palette (the same tokens as css/sumi.css, inlined: this page is one screen and should not wait on the site's sheet): sumi
       ground, the silver grain, paper text, mono labels; the page image is toned to the site's paper (#e9e7e2, multiplied: no pure white on the
       site) and framed as a lit print on sumi. On a phone the sheet keeps a readable width (760 px), opens centred on its header and scrolls sideways. No red anywhere. -->
  <style>
    :root { --paper: #e9e7e2; --sumi: #141416; --deep: #0b0b0d; --dim: #bab8b3; --rule: rgba(233,231,226,.18); --rule-strong: rgba(233,231,226,.3);
      --serif: 'Shippori Mincho', 'Noto Serif JP', 'Yu Mincho', Georgia, serif; --mono: 'Share Tech Mono', ui-monospace, Menlo, Consolas, monospace; --gutter: clamp(16px, 6.7vw, 96px) }
    * { box-sizing: border-box }
    html { background: var(--sumi); color-scheme: dark }
    body { margin: 0; min-height: 100vh; background: var(--sumi); color: var(--paper); font: 400 16px/1.6 var(--serif); -webkit-font-smoothing: antialiased }
    body::after { content: ""; position: fixed; inset: 0; pointer-events: none; z-index: 50; opacity: .10; background-size: 256px 256px;
      background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='256' height='256'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.8' numOctaves='3' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .914  0 0 0 0 .906  0 0 0 0 .886  2.2 0 0 0 -.6'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>") }
    a { color: inherit; text-decoration: none }
    :focus-visible { outline: 2px solid var(--paper); outline-offset: 3px }
    .seal { display: inline-block; width: 32px; height: 32px; flex: none }
    .nav { position: sticky; top: 0; z-index: 3; height: 60px; display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 0 var(--gutter); background: var(--sumi); border-bottom: 1px solid var(--rule) }
    .wordmark { display: inline-flex; align-items: center; gap: 14px; padding: 4px 0; font-size: 13px; letter-spacing: .2em; text-transform: uppercase }
    .wordmark .wm { white-space: nowrap }
    .acts { display: flex; align-items: center; gap: 28px }
    .act { display: inline-block; padding: 12px 0; margin: -12px 0; font-family: var(--mono); font-size: 12px; letter-spacing: .12em; text-transform: uppercase; color: var(--dim); white-space: nowrap }   /* 40 px hit boxes */
    .act:hover, .act:focus-visible { color: var(--paper); text-decoration: underline; text-underline-offset: 6px; text-decoration-thickness: 1px }
    .act.dl { color: var(--paper); padding: 12px 8px; margin: -12px -8px; outline: 2px solid transparent; outline-offset: -1px }   /* the site's link language (mono, tracked, an arrow); the paper outline (2 px, as every focus ring) only on hover / focus */
    .act.dl:hover, .act.dl:focus-visible { outline-color: var(--paper); text-decoration: none }
    main { padding: 56px var(--gutter) 0 }
    .scroll { display: flex; justify-content: center; padding-bottom: 32px }
    /* the sheet is the positioning context for the link overlay: a lit print, paper on sumi with a hairline and a hard offset shadow */
    .sheet { position: relative; flex: none; width: 100%; max-width: 850px; background: var(--paper); border: 1px solid var(--rule-strong); box-shadow: 12px 12px 0 var(--deep), 13px 13px 0 var(--rule); margin-right: 13px }
    .sheet img { width: 100%; height: auto; display: block; mix-blend-mode: multiply }
    /* link hotspots, positioned in % so they scale with the image; hover / focus draws a sumi hairline box on the paper */
    .lk { position: absolute; display: block; cursor: pointer; background: rgba(20,20,22,0); box-shadow: 0 0 0 0 rgba(20,20,22,0); transition: background .12s ease, box-shadow .12s ease }
    .lk:hover, .lk:focus-visible { background: rgba(20,20,22,.08); box-shadow: 0 0 0 2px rgba(20,20,22,.7); outline: none }
    .hint { text-align: center; color: var(--dim); font-family: var(--mono); font-size: 11px; letter-spacing: .22em; text-transform: uppercase; padding: 0 0 56px; margin: 0 }
    .hint a { display: inline-block; padding: 12px 0; margin: -12px 0; color: var(--paper); text-decoration: underline; text-underline-offset: 5px; text-decoration-thickness: 1px }
    .hint .ph, .hint .tab { display: none }
    @media (pointer: coarse) and (min-width: 721px) { .hint .desk { display: none } .hint .tab { display: inline } main { display: flex; flex-direction: column } .hint { order: -1; padding: 0 0 20px } }   /* a touch tablet: the sheet fits but its text is ~9 px, so the hint (zoom, or the PDF) comes first, in the first view, as on a phone */
    .sr-only { position: absolute; width: 1px; height: 1px; margin: -1px; padding: 0; overflow: hidden; clip: rect(0 0 0 0); clip-path: inset(50%); white-space: nowrap; border: 0 }
    @media (max-width: 720px) {
      .nav { height: 56px } .wordmark { gap: 10px; padding: 7px; margin: -7px } .wordmark .seal { width: 26px; height: 26px }   /* a 40 px target round the seal, nothing moves */
      .wordmark .wm { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%) }   /* the seal alone: the page's title says the rest */
      .acts { gap: 16px } .act { font-size: 11px }
      main { padding: 16px 0 0; display: flex; flex-direction: column }
      /* the sheet at a readable width (its text about 10 px), scrolled sideways; the hint says so and offers the PDF in the phone's own viewer (pinch zoom) */
      .scroll { justify-content: flex-start; overflow-x: auto; -webkit-overflow-scrolling: touch; padding: 0 var(--gutter) 28px; overscroll-behavior-x: contain }
      .sheet { width: 760px; max-width: none; box-shadow: 8px 8px 0 var(--deep), 9px 9px 0 var(--rule); margin-right: 9px }
      .hint { order: -1; padding: 0 var(--gutter) 12px; letter-spacing: .14em; line-height: 2 } .hint .desk { display: none } .hint .ph { display: inline }   /* on a phone the hint comes first: the sheet is wider than the screen */
    }
    /* a finger-sized hit area (40 px and up) round each link, the box itself unchanged. Where two links stack (the Springer and NSF papers) or
       sit side by side (the ScholarWorks paper and its code), each takes its own half of the gap and reaches further the other way, so no
       two hit areas overlap */
    @media (pointer: coarse) {
      .lk::after { content: ""; position: absolute; inset: -14px -6px }
      .lk.up::after { top: -28px; bottom: 0 } .lk.down::after { top: 0; bottom: -28px }
      .lk.lft::after { right: 0; left: -12px } .lk.rgt::after { left: 0; right: -12px }
    }
    @media (prefers-reduced-motion: reduce) { .lk { transition: none } }
  </style>

  <script>
    // a phone: the sheet opens centred on its header, so the first thing seen is his whole name and contact row, not a cropped name; the
    // hint above it says to swipe, both ways
    if (matchMedia('(max-width: 720px)').matches) {
      var s = document.querySelector('.scroll'), sh = s && s.querySelector('.sheet');
      if (s && sh) { var a = s.getBoundingClientRect(), b = sh.getBoundingClientRect(); s.scrollLeft = Math.max(0, b.left - a.left + s.scrollLeft + b.width / 2 - s.clientWidth / 2); }
