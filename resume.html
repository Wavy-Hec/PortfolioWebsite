  <!-- The résumé renders as an image so it always displays inline (a browser set to "download PDFs" — common on macOS — can't be forced to
       render a PDF in an <object>/<iframe>). Every clickable region from the PDF is re-created as a positioned <a> over the image, so hover
       + links still work. Rect percentages are generated from the PDF's own link annotations, so they track the page exactly at any zoom.
       Regenerate both when the PDF changes (tools/build-resume-view.py).
       The night palette (the same tokens as css/sumi.css, inlined: this page is one screen and should not wait on the site's sheet): sumi
       ground, the silver grain, paper text, mono labels; the page image is paper and stays paper, framed as a lit print on sumi. No red anywhere. -->
  <style>
    :root { --paper: #e9e7e2; --sumi: #141416; --deep: #0b0b0d; --dim: #bab8b3; --rule: rgba(233,231,226,.18); --rule-strong: rgba(233,231,226,.3);
      --serif: 'Shippori Mincho', 'Noto Serif JP', 'Yu Mincho', Georgia, serif; --mono: 'Share Tech Mono', ui-monospace, Menlo, Consolas, monospace; --gutter: clamp(16px, 6.7vw, 96px) }
    * { box-sizing: border-box }
    html { background: var(--sumi); color-scheme: dark }
    body { margin: 0; min-height: 100vh; background: var(--sumi); color: var(--paper); font: 400 16px/1.6 var(--serif); -webkit-font-smoothing: antialiased }
    body::after { content: ""; position: fixed; left: -256px; top: -256px; right: -256px; bottom: -256px; pointer-events: none; z-index: 50; opacity: .11; background-size: 256px 256px;
      background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='256' height='256'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.8' numOctaves='3' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .914  0 0 0 0 .906  0 0 0 0 .886  2.2 0 0 0 -.6'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>") }
    @keyframes crawl { 0% { transform: translate(0, 0) } 12.5% { transform: translate(-96px, 40px) } 25% { transform: translate(-160px, -72px) } 37.5% { transform: translate(-32px, -128px) } 50% { transform: translate(-200px, 96px) } 62.5% { transform: translate(-72px, 160px) } 75% { transform: translate(-224px, -24px) } 87.5% { transform: translate(-128px, 112px) } }
    @media (prefers-reduced-motion: no-preference) { body::after { animation: crawl 1s step-end infinite } }
    a { color: inherit; text-decoration: none }
    :focus-visible { outline: 2px solid var(--paper); outline-offset: 3px }
    .seal { display: inline-block; width: 32px; height: 32px; flex: none }
    .nav { position: sticky; top: 0; z-index: 3; height: 60px; display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 0 var(--gutter); background: var(--sumi); border-bottom: 1px solid var(--rule) }
    .wordmark { display: inline-flex; align-items: center; gap: 14px; font-size: 13px; letter-spacing: .2em; text-transform: uppercase }
    .wordmark .wm { white-space: nowrap }
    .acts { display: flex; align-items: center; gap: 28px }
    .act { font-family: var(--mono); font-size: 12px; letter-spacing: .12em; text-transform: uppercase; color: var(--dim); white-space: nowrap }
    .act:hover, .act:focus-visible { color: var(--paper); text-decoration: underline; text-underline-offset: 6px; text-decoration-thickness: 1px }
    .act.dl { color: var(--paper); outline: 1px solid transparent; outline-offset: 8px }   /* the site's link language (mono, tracked, an arrow); the paper outline only on hover / focus */
    .act.dl:hover, .act.dl:focus-visible { outline-color: var(--paper); text-decoration: none }
    main { padding: 56px var(--gutter) 32px; display: flex; justify-content: center }
    /* the sheet is the positioning context for the link overlay: a lit print, paper on sumi with a hairline and a hard offset shadow */
    .sheet { position: relative; width: 100%; max-width: 850px; background: #fff; border: 1px solid var(--rule-strong); box-shadow: 12px 12px 0 var(--deep), 13px 13px 0 var(--rule); margin-right: 13px }
    .sheet img { width: 100%; height: auto; display: block }
    /* link hotspots, positioned in % so they scale with the image; hover / focus draws a sumi hairline box on the paper */
    .lk { position: absolute; display: block; cursor: pointer; background: rgba(20,20,22,0); box-shadow: 0 0 0 0 rgba(20,20,22,0); transition: background .12s ease, box-shadow .12s ease }
    .lk:hover, .lk:focus-visible { background: rgba(20,20,22,.08); box-shadow: 0 0 0 2px rgba(20,20,22,.7); outline: none }
    .hint { text-align: center; color: var(--dim); font-family: var(--mono); font-size: 11px; letter-spacing: .22em; text-transform: uppercase; padding: 0 var(--gutter) 56px; margin: 0 }
    @media (max-width: 720px) {
      .nav { height: 56px } .wordmark { gap: 10px } .wordmark .seal { width: 26px; height: 26px }
      .wordmark .wm { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%) }   /* the seal alone: the page's title says the rest */
      .acts { gap: 16px } .act { font-size: 11px } .act.dl { outline-offset: 6px }
      main { padding: 24px var(--gutter) 24px } .sheet { box-shadow: 8px 8px 0 var(--deep), 9px 9px 0 var(--rule); margin-right: 9px }
    }
    @media (prefers-reduced-motion: reduce) { .lk { transition: none } }
  </style>
