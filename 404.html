<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#141416">
  <meta name="robots" content="noindex">
  <title>404 — Hector Lugo</title>
  <!-- served at any path, so nothing here is relative: the seal is inline, the rest absolute -->
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cpath fill='%23e9e7e2' d='M32.4 2.2C48.6 1.3 62.6 14.6 62 31.4 61.5 47.9 49.2 61.4 32.6 62 16 62.6 2.2 49.4 2 32.8 1.8 16.6 16 3 32.4 2.2Z'/%3E%3Cpath fill='%23141416' d='M14.2 14.4 23 14 23.6 50.2 14.6 50.6ZM22 29.2 32.6 28.8 32.8 36 22.2 36.4ZM31.4 14.2 40.4 13.8 40.8 42.6 51.6 42.2 52 49.6 31.8 50.6Z'/%3E%3C/svg%3E">
  <link rel="icon" href="https://wavy-hec.github.io/PortfolioWebsite/favicon-32.png?v=7" type="image/png" sizes="32x32">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@400&family=Share+Tech+Mono&display=swap" media="print" onload="this.media='all'">
  <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@400&family=Share+Tech+Mono&display=swap"></noscript>
  <style>
    :root {
      --paper: #e9e7e2;
      --sumi: #141416;
      --dim: #bab8b3;
      --rule: rgba(233, 231, 226, 0.18);
      --serif: 'Shippori Mincho', 'Noto Serif JP', 'Yu Mincho', Georgia, serif;
      --mono: 'Share Tech Mono', ui-monospace, Menlo, Consolas, monospace;
      --gutter: clamp(16px, 6.7vw, 96px);
      color-scheme: dark;
    }
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    html {
      background: var(--sumi);
    }
    /* the ridge over the words, the pair centred in the screen's height */
    body {
      height: 100vh;
      height: 100svh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      justify-content: safe center;
      padding: 24px 0 40px;
      background: var(--sumi);
      color: var(--paper);
      font: 400 16px/1.6 var(--serif);
      -webkit-font-smoothing: antialiased;
    }
    body::after {
      content: '';
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 50;
      opacity: 0.1;
      background-size: 256px 256px;
      background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='256' height='256'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.8' numOctaves='3' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .914  0 0 0 0 .906  0 0 0 0 .886  2.2 0 0 0 -.6'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
    }
    a {
      color: inherit;
      text-decoration: none;
    }
    :focus-visible {
      outline: 2px solid var(--paper);
      outline-offset: 3px;
    }
    /* it gives up its height before the words do, so the way back stays on the first screen */
    .ridge {
      position: relative;
      flex: 0 1 calc(140px + 18vw);
      overflow: hidden;
      pointer-events: none;
    }
    .ridge canvas {
      position: absolute;
      left: 0;
      bottom: 0;
      width: 100%;
      height: 100%;
      image-rendering: pixelated;
    }
    .msg {
      margin: 8px var(--gutter) 0;
      padding-top: 32px;
      border-top: 1px solid var(--rule);
    }
    .msg > * {
      max-width: 46ch;
    }
    .kicker {
      font-family: var(--mono);
      font-size: 11px;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: var(--dim);
    }
    h1 {
      font-weight: 400;
      font-size: 40px;
      line-height: 1.1;
      margin-top: 14px;
      text-wrap: balance;
    }
    p {
      color: var(--dim);
      margin-top: 16px;
    }
    .back {
      display: inline-block;
      margin-top: 16px;
      padding: 12px 0;
      font-family: var(--mono);
      font-size: 11px;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: var(--paper);
    }
    .back:hover,
    .back:focus-visible {
      text-decoration: underline;
      text-underline-offset: 6px;
      text-decoration-thickness: 1px;
    }
    /* a phone or a tall tablet starts from the top, not from bare sumi */
    @media (max-width: 720px) {
      body {
        justify-content: flex-start;
        padding-top: 32px;
      }
      h1 {
        font-size: 32px;
      }
    }
    @media (min-width: 721px) and (max-width: 1024px) and (orientation: portrait) {
      body {
        justify-content: flex-start;
        padding-top: 48px;
      }
    }
    /* a phone on its side has room for the words only */
    @media (max-height: 440px) {
      body {
        padding: 16px 0;
      }
      .ridge {
        display: none;
      }
    }
    /* the front page's measure on large screens */
    @media (min-width: 1600px) {
      .msg {
        margin-left: calc(50% - 576px);
        margin-right: calc(50% - 576px);
      }
    }
  </style>
</head>
<body>
  <div class="ridge" aria-hidden="true"><canvas></canvas></div>
  <main class="msg">
    <p class="kicker">404 · page not found</p>
    <h1>Nothing stands here.</h1>
    <p>The link you followed points to a page that has moved or never existed. The front page has everything: the work, the experience, the papers.</p>
    <a class="back" href="https://wavy-hec.github.io/PortfolioWebsite/"><span aria-hidden="true">← </span>back to the front page</a>
  </main>
  <script>
    // a wide ridge with nothing on it, printed like the front page's closing band (js/sumi-ridge.js)
    (() => {
      'use strict';
      const band = document.querySelector('.ridge');
      const canvas = band.querySelector('canvas');
      const PAPER = 0xffe2e7e9; // #e9e7e2 as one little-endian pixel
      const BAYER = [0, 8, 2, 10, 12, 4, 14, 6, 3, 11, 1, 9, 15, 7, 13, 5];
      const CREASE = 0.04;
      const SPUR_FALL = 0.45;
      const SLICE_MS = 8;
      // far to near, in band heights from the top and from the high ground; tones in levels of 16
      const RIDGES = [
        { seed: 91, foot: 0.6, rise: 0.12, span: 0.45, rough: 0.4, tone: 3.4, fog: 4.8 },
        {
          seed: 495,
          foot: 0.68,
          rise: 0.18,
          span: 0.45,
          rough: 0.35,
          tone: 1.4,
          fog: 5.4,
          rightOf: -0.2,
          shoulder: { at: 1.3, rise: 0.18 },
        },
        {
          seed: 420,
          foot: 0.78,
          rise: 0.22,
          span: 0.65,
          rough: 0.42,
          tone: 0.5,
          fog: 6.2,
          leftOf: 0.5,
        },
        { seed: 140, foot: 0.88, rise: 0.32, span: 0.7, rough: 0.5, tone: 0, fog: 0 },
      ];
      const HIGH = { at: 0.38, rise: 0.22, reach: 0.8, cone: 0.5 };

      function mulberry32(seed) {
        let a = seed >>> 0;
        return () => {
          a = (a + 0x6d2b79f5) >>> 0;
          let t = a;
          t = Math.imul(t ^ (t >>> 15), t | 1);
          t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
          return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
        };
      }
      const smooth = t => {
        const c = Math.min(1, Math.max(0, t));
        return c * c * (3 - 2 * c);
      };
      function value(knots, x) {
        const i = Math.floor(x);
        const a = knots[i & 1023];
        return a + (knots[(i + 1) & 1023] - a) * smooth(x - i);
      }
      function ridged(knots, x, rough, octaves) {
        let sum = 0;
        let norm = 0;
        let amp = 1;
        let weight = 1;
        for (let o = 0; o < octaves; o++) {
          const d = 2 * value(knots, x) - 1;
          const crease = 1 + CREASE - Math.sqrt(d * d + CREASE * CREASE);
          sum += amp * weight * crease;
          norm += amp;
          weight = Math.min(1, 0.3 + crease);
          amp *= rough;
          x = x * 2.17 + 31.7;
        }
        return sum / norm;
      }
      const jitter = (x, y) => {
        let h = Math.imul(x * 374761393 + y * 668265263, 1274126177) >>> 0;
        h = Math.imul(h ^ (h >>> 13), 1274126177) >>> 0;
        return (h & 1023) / 1023 - 0.5;
      };
      for (const ridge of RIDGES) {
        ridge.knots = Float32Array.from({ length: 1024 }, mulberry32(ridge.seed));
      }

      function crestOf(i, u, octaves) {
        const ridge = RIDGES[i];
        const height = ridged(ridge.knots, u / ridge.span + 300, ridge.rough, octaves);
        let foot = ridge.foot;
        if (ridge.shoulder) {
          const fall = u < ridge.shoulder.at ? 0.45 : 0.3;
          foot -= ridge.shoulder.rise * Math.exp(-Math.abs(u - ridge.shoulder.at) / fall);
        }
        if (i === 0) {
          const lift = HIGH.rise * Math.exp(-Math.abs(u) / HIGH.reach);
          return foot - ridge.rise * height - lift * (HIGH.cone + (1 - HIGH.cone) * height);
        }
        let stands = 1;
        if ('rightOf' in ridge) stands = smooth((u - ridge.rightOf) / SPUR_FALL + 0.5);
        if ('leftOf' in ridge) stands = smooth((ridge.leftOf - u) / SPUR_FALL + 0.5);
        return foot - ridge.rise * (height * stands - 0.2 * (1 - stands));
      }

      let sliceTimer = 0;
      function draw(cols, rows, show) {
        const image = new ImageData(cols, rows);
        const dots = new Uint32Array(image.data.buffer);
        const crest = [];
        const shape = [];

        function column(x) {
          const u = (x - cols * HIGH.at) / rows;
          for (let i = 0; i < RIDGES.length; i++) {
            crest[i] = rows * crestOf(i, u, 5);
            shape[i] = rows * crestOf(i, u, 2);
          }
          let floor = rows;
          let front = rows;
          for (let i = RIDGES.length - 1; i >= 0; i--) {
            const ridge = RIDGES[i];
            const top = Math.max(0, Math.ceil(crest[i]));
            const depth = Math.max(0.02 * rows, front - shape[i]);
            for (let y = top; y < floor; y++) {
              const mist = smooth((y - shape[i]) / depth);
              const level = ridge.tone + (ridge.fog - ridge.tone) * mist * mist;
              if (BAYER[(y & 3) * 4 + (x & 3)] + 0.5 < level + 0.9 * jitter(x, y)) {
                dots[y * cols + x] = PAPER;
              }
            }
            floor = Math.min(floor, top);
            front = Math.min(front, shape[i]);
          }
        }

        let x = 0;
        function slice() {
          const until = performance.now() + SLICE_MS;
          while (x < cols && performance.now() < until) column(x++);
          if (x < cols) {
            sliceTimer = setTimeout(slice);
            return;
          }
          show(image);
        }
        slice();
      }

      let drawn = '';
      function layout() {
        // a dot is a whole number of device pixels, so the screen never beats against the display
        const ratio = window.devicePixelRatio || 1;
        const dotPx = Math.max(1, Math.round(ratio)) / ratio;
        const cols = Math.ceil(band.clientWidth / dotPx);
        const rows = Math.ceil(band.clientHeight / dotPx);
        if (!rows) return; // hidden on a phone on its side
        const fit = () => {
          canvas.style.width = cols * dotPx + 'px';
          canvas.style.height = rows * dotPx + 'px';
        };
        if (drawn === cols + 'x' + rows) {
          fit();
          return;
        }
        drawn = cols + 'x' + rows;
        clearTimeout(sliceTimer);
        draw(cols, rows, image => {
          canvas.width = cols;
          canvas.height = rows;
          fit();
          canvas.getContext('2d').putImageData(image, 0, 0);
        });
      }

      let resizeTimer = 0;
      addEventListener(
        'resize',
        () => {
          canvas.style.width = '';
          canvas.style.height = '';
          clearTimeout(resizeTimer);
          resizeTimer = setTimeout(layout, 150);
        },
        { passive: true },
      );
      // after the words are laid out, not inside the page's first task
      requestAnimationFrame(layout);
    })();
  </script>
</body>
</html>
