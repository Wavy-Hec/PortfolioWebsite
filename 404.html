<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <title>404 — Hector Lugo</title>
  <script>try{var t=localStorage.getItem('theme');if(t==='codec'||t==='starwars'||t==='gotham')document.documentElement.dataset.theme=t}catch(e){}</script>
  <!-- PNG first so legacy Safari (no SVG favicon support) picks it up -->
  <link rel="icon" href="https://wavy-hec.github.io/PortfolioWebsite/favicon-32.png?v=2" type="image/png" sizes="32x32">
  <link rel="icon" href="https://wavy-hec.github.io/PortfolioWebsite/favicon.svg?v=2" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <!-- Fonts load async (media swap) — don't block first paint on a cross-origin CSS fetch -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Spectral:wght@700;800&family=Share+Tech+Mono&display=swap" media="print" onload="this.media='all'">
  <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Spectral:wght@700;800&family=Share+Tech+Mono&display=swap"></noscript>
  <!-- Self-contained on purpose: GitHub Pages serves 404.html at any missing path,
       so relative asset URLs would break. Theme values are copied from style.css
       and applied pre-paint from the saved localStorage 'theme'. -->
  <style>
    :root {
      --bg: #eaf0fb;
      --panel: #ffffff;
      --panel-2: #f4f7fd;
      --border: #ccd8f1;
      --ink: #2f54cc;
      --ink-strong: #2746b4;
      --text: #46568c;
      --dim: #5d6a8c;
      --muted: #5f6987;
      --error: #cc2f3f;
      --on-accent: #ffffff;
      --wash: #f5f8fe;
      --scan: rgba(31, 80, 120, .04);
      --shadow: 0 10px 28px rgba(39, 70, 180, .10);
    }
    html[data-theme="codec"] {
      color-scheme: dark;
      --bg: #081209;
      --panel: #0e1d13;
      --panel-2: #132619;
      --border: #1e3526;
      --ink: #6fcf83;
      --ink-strong: #a4ecb1;
      --text: #a9cbae;
      --dim: #84ab8b;
      --muted: #6f9a78;
      --error: #e0606d;
      --on-accent: #07140b;
      --wash: #0d2012;
      --scan: rgba(111, 207, 131, .05);
      --shadow: 0 10px 28px rgba(0, 0, 0, .55);
    }
    html[data-theme="starwars"] {
      color-scheme: dark;
      --bg: #060a12;
      --panel: #0b1523;
      --panel-2: #112337;
      --border: #193553;
      --ink: #4aa8ff;
      --ink-strong: #8cc6ff;
      --text: #c3d6ec;
      --dim: #92a9c4;
      --muted: #8aa2bd;
      --error: #f0a832;
      --on-accent: #04101c;
      --wash: #0d1a30;
      --scan: rgba(74, 168, 255, 0);
      --shadow: 0 10px 28px rgba(0, 0, 0, .6), 0 0 16px rgba(74, 168, 255, .08);
    }
    html[data-theme="gotham"] {
      color-scheme: dark;
      --bg: #0c0d10;
      --panel: #0a0a0c;
      --panel-2: #121114;
      --border: #2b2723;
      --ink: #d4af6a;
      --ink-strong: #e8cf9a;
      --text: #c4bfb4;
      --dim: #9a948a;
      --muted: #8f897f;
      --error: #f0564f;
      --on-accent: #171107;
      --wash: #262a31;
      --scan: rgba(196, 191, 180, .04);
      --shadow: 0 10px 28px rgba(0, 0, 0, .7);
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background: var(--bg);
      background-image:
        repeating-linear-gradient(0deg, var(--scan) 0 1px, transparent 1px 4px),
        radial-gradient(ellipse 90% 55% at 50% 0%, var(--wash), transparent 60%);
      font-family: 'Spectral', Georgia, serif;
      color: var(--text);
    }
    .terminal {
      width: 100%;
      max-width: 640px;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 6px;
      overflow: hidden;
      box-shadow: var(--shadow);
    }
    .bar {
      padding: 12px 18px;
      background: var(--panel-2);
      border-bottom: 1px solid var(--border);
      font-family: 'Share Tech Mono', monospace;
      font-size: 13px;
      font-weight: 400;
      letter-spacing: 1px;
      text-transform: uppercase;
      color: var(--muted);
    }
    .body { padding: 26px 24px; font-family: 'Share Tech Mono', monospace; font-size: 15px; line-height: 2; }
    .prompt { color: var(--ink); margin-right: 8px; }
    .out { color: var(--dim); padding-left: 16px; }
    .alert { color: var(--error); }
    .cursor::after { content: '_'; animation: blink 1.1s infinite; color: var(--ink); }
    @keyframes blink { 0%, 50% { opacity: 1; } 51%, 100% { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) { .cursor::after { animation: none; } }
    .home-btn {
      display: inline-block;
      margin: 18px 0 6px 16px;
      font-family: 'Spectral', serif;
      font-weight: 700;
      font-size: 15px;
      color: var(--on-accent);
      background: var(--ink);
      border: 1px solid var(--ink);
      border-radius: 4px;
      padding: 10px 22px;
      text-decoration: none;
    }
    .home-btn:hover { background: var(--ink-strong); border-color: var(--ink-strong); }
    .egg { margin: 22px 0 6px 16px; }
    .egg img {
      display: block;
      width: min(200px, 55%);
      height: auto;
      image-rendering: pixelated;
      border: 1px solid var(--border);
      border-radius: 4px;
    }
    .egg figcaption {
      margin-top: 8px;
      font-family: 'Share Tech Mono', monospace;
      font-size: 12.5px;
      letter-spacing: .5px;
      color: var(--muted);
    }
    /* The PNG is already a dark hologram (navy -> holo blue #4aa8ff), so no
       invert anywhere: starwars/gotham show it as-is (it IS their holo blue);
       codec swings the blue ~-82deg to phosphor green. */
    html[data-theme="codec"] .egg img { filter: hue-rotate(278deg) brightness(1.1); }
  </style>
</head>
<body>
  <main class="terminal">
    <h1 class="bar">hector@big-shell: ~ — 404</h1>
    <div class="body">
      <p><span class="prompt">$</span> locate requested-page</p>
      <p class="out"><span class="alert">!</span> alert — page not found. it must have been hiding in a cardboard box.</p>
      <p><span class="prompt">$</span> codec --freq 140.85</p>
      <p class="out">"Snake, that page doesn't exist. Return to the portfolio at once."</p>
      <!-- Absolute src on purpose: GitHub Pages serves this page at any missing
           path, so a relative src would 404 recursively. onerror degrades the
           whole figure away if the PNG isn't deployed. -->
      <figure class="egg">
        <img src="https://wavy-hec.github.io/PortfolioWebsite/img/lego-quigon-dither.png" alt="Dithered render of a LEGO Qui-Gon Jinn minifigure floating serenely" loading="lazy" onerror="this.parentElement.style.display='none'">
        <figcaption>These aren't the pages you're looking for.</figcaption>
      </figure>
      <a class="home-btn" href="https://wavy-hec.github.io/PortfolioWebsite/">&larr; back to base</a>
      <p><span class="prompt">$</span> <span class="cursor"></span></p>
    </div>
  </main>
</body>
</html>
