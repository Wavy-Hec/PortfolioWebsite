<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#141416">
  <meta name="robots" content="noindex">
  <title>404 — Hector Lugo</title>
  <!-- favicon = the seal (the same drawing as index.html's #seal), inline so the tab never waits on a file; the PNG by absolute URL for Safari -->
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cpath fill='%23e9e7e2' d='M32.4 2.2C48.6 1.3 62.6 14.6 62 31.4 61.5 47.9 49.2 61.4 32.6 62 16 62.6 2.2 49.4 2 32.8 1.8 16.6 16 3 32.4 2.2Z'/%3E%3Cpath fill='%23141416' d='M14.2 14.4 23 14 23.6 50.2 14.6 50.6ZM22 29.2 32.6 28.8 32.8 36 22.2 36.4ZM31.4 14.2 40.4 13.8 40.8 42.6 51.6 42.2 52 49.6 31.8 50.6Z'/%3E%3C/svg%3E">
  <link rel="icon" href="https://wavy-hec.github.io/PortfolioWebsite/favicon-32.png?v=7" type="image/png" sizes="32x32">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@400&family=Share+Tech+Mono&display=swap" media="print" onload="this.media='all'">
  <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@400&family=Share+Tech+Mono&display=swap"></noscript>
  <!-- Self-contained on purpose: GitHub Pages serves 404.html at any missing path, so relative asset URLs would break. The night palette
       (the same tokens as css/sumi.css, inlined): sumi ground, the silver grain, paper text, mono labels. -->
  <style>
    :root { --paper: #e9e7e2; --sumi: #141416; --deep: #0b0b0d; --dim: #bab8b3; --rule: rgba(233,231,226,.18); --rule-strong: rgba(233,231,226,.3);
      --serif: 'Shippori Mincho', 'Noto Serif JP', 'Yu Mincho', Georgia, serif; --mono: 'Share Tech Mono', ui-monospace, Menlo, Consolas, monospace; color-scheme: dark }
    * { margin: 0; padding: 0; box-sizing: border-box }
    html { background: var(--sumi) }
    body { min-height: 100vh; min-height: 100svh; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; padding: 24px; padding-top: min(46vw, 420px, 36vh);   /* the card sits under the gate's beams */
      background: var(--sumi); color: var(--paper); font: 400 16px/1.6 var(--serif); -webkit-font-smoothing: antialiased }
    body::after { content: ""; position: fixed; inset: 0; pointer-events: none; z-index: 50; opacity: .10; background-size: 256px 256px;
      background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='256' height='256'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.8' numOctaves='3' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .914  0 0 0 0 .906  0 0 0 0 .886  2.2 0 0 0 -.6'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>") }
    a { color: inherit; text-decoration: none }
    :focus-visible { outline: 2px solid var(--paper); outline-offset: 3px }
    /* the torii: ascii-magic's sea-torii-sunset in mono paper dots, the sun the one bright shape, the gate a silhouette in the dots; sized to the viewport's
       width (an inline script sets the piece's font size: 192 columns x size x .602 px = 100vw), fixed to the top, its sea fading into the sumi under the
       card. On a phone (<= 720) the piece is set at 96 columns = 100vw, twice the width, centred, so the gate (the middle third of the piece) fills the
       width above the card in 4 px cells instead of vanishing into 2 px grain. Decorative: aria-hidden. Holds its first frame under reduced motion (the engine does that itself). */
    .torii { position: fixed; left: 0; top: -10vw; width: 100vw; z-index: 0; pointer-events: none; color: var(--paper); opacity: .9;
      -webkit-mask-image: linear-gradient(transparent 20%, #000 33%, #000 62%, transparent 96%); mask-image: linear-gradient(transparent 20%, #000 33%, #000 62%, transparent 96%) }
    .torii ascii-art { display: block; width: 100%; color: inherit }
    .torii ascii-art canvas { display: block }
    html.no-torii .torii { display: none }
    /* the card: deep sumi, a hairline, a hard offset shadow */
    .card { position: relative; z-index: 1; width: 100%; max-width: 560px; background: var(--deep); border: 1px solid var(--rule-strong); box-shadow: 12px 12px 0 var(--sumi), 13px 13px 0 var(--rule); margin-right: 13px; padding: 36px 40px 40px }
    .kicker { font-family: var(--mono); font-size: 11px; letter-spacing: .22em; text-transform: uppercase; color: var(--dim) }
    h1 { font-weight: 400; font-size: 40px; line-height: 1.1; margin-top: 14px }
    p { color: var(--dim); margin-top: 16px; max-width: 40ch }
    .back { display: inline-block; margin-top: 28px; font-family: var(--mono); font-size: 11px; letter-spacing: .22em; text-transform: uppercase; color: var(--paper); padding: 2px 0 }
    .back:hover, .back:focus-visible { text-decoration: underline; text-underline-offset: 6px; text-decoration-thickness: 1px }
    .credit { position: relative; z-index: 1; max-width: none; margin-top: 18px; text-align: center; font-family: var(--mono); font-size: 10px; letter-spacing: .2em; text-transform: uppercase; color: var(--dim); opacity: .8 }
    .credit a:hover, .credit a:focus-visible { text-decoration: underline; text-underline-offset: 4px }
    @media (max-width: 720px) {
      body { padding-top: min(72vw, 420px, 40vh) }
      .torii { width: 200vw; left: -50vw; top: -6vw; -webkit-mask-image: linear-gradient(#000 40%, transparent 92%); mask-image: linear-gradient(#000 40%, transparent 92%) }
      .card { padding: 28px 24px 32px; box-shadow: 8px 8px 0 var(--sumi), 9px 9px 0 var(--rule); margin-right: 9px } h1 { font-size: 32px }
    }
  </style>
</head>
<body>
  <!-- the torii: a self-hosted ascii-magic piece (js/ascii/pieces/sea-torii-sunset.js) drawn by the self-hosted engine (js/ascii/ascii.js).
       The engine's URL must be absolute: this page is served at any missing path. On the live site the repo lives under /PortfolioWebsite/
       (https://wavy-hec.github.io/PortfolioWebsite/); served locally from the repo root it lives under /. The script below picks the order from
       where it runs and falls back to the other on a failed import, so both work; if neither loads, html.no-torii hides the empty slot. -->
  <div class="torii" aria-hidden="true"><ascii-art piece="sea-torii-sunset" look="dots" mono contrast="100" density="85" dot-size="45" aria-hidden="true"></ascii-art></div>
  <script>
    (function () {
      var el = document.querySelector('.torii ascii-art');
      if (!el) return;
      var fit = function () { var phone = innerWidth <= 720; el.setAttribute('size', (innerWidth / ((phone ? 96 : 192) * 0.602)).toFixed(2)); el.setAttribute('dot-size', phone ? '60' : '45'); };
      fit(); var rt; addEventListener('resize', function () { clearTimeout(rt); rt = setTimeout(fit, 200); }, { passive: true });
      var repo = /github\.io$/.test(location.hostname) || location.pathname.indexOf('/PortfolioWebsite/') === 0;
      var paths = repo ? ['/PortfolioWebsite/js/ascii/ascii.js', '/js/ascii/ascii.js'] : ['/js/ascii/ascii.js', '/PortfolioWebsite/js/ascii/ascii.js'];
      import(paths[0]).catch(function () { return import(paths[1]); }).catch(function () { document.documentElement.classList.add('no-torii'); });
    })();
  </script>
  <main class="card">
    <p class="kicker">404 · page not found</p>
    <h1>Nothing stands here.</h1>
    <p>The page you followed has moved or never was. The front page has everything: the work, the experience, the papers.</p>
    <a class="back" href="https://wavy-hec.github.io/PortfolioWebsite/">← back to the front page</a>
  </main>
  <p class="credit">the torii: sea-torii-sunset · halftone engine: <a href="https://www.ascii-magic.com/" rel="noopener">ascii-magic.com</a></p>
</body>
</html>
