<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#141416">
  <meta name="robots" content="noindex">
  <title>404 — Hector Lugo</title>
  <!-- favicon = the seal (the same drawing as index.html's #seal), inline so the tab never waits on a file; the PNG by absolute URL for Safari -->
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cpath fill='%23e9e7e2' d='M32.4 2.2C48.6 1.3 62.6 14.6 62 31.4 61.5 47.9 49.2 61.4 32.6 62 16 62.6 2.2 49.4 2 32.8 1.8 16.6 16 3 32.4 2.2Z'/%3E%3Cpath fill='%23141416' d='M14.2 14.4 23 14 23.6 50.2 14.6 50.6ZM22 29.2 32.6 28.8 32.8 36 22.2 36.4ZM31.4 14.2 40.4 13.8 40.8 42.6 51.6 42.2 52 49.6 31.8 50.6Z'/%3E%3C/svg%3E">
  <link rel="icon" href="https://wavy-hec.github.io/PortfolioWebsite/favicon-32.png?v=7" type="image/png" sizes="32x32">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@400&family=Share+Tech+Mono&display=swap" media="print" onload="this.media='all'">
  <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@400&family=Share+Tech+Mono&display=swap"></noscript>
  <!-- Self-contained on purpose: GitHub Pages serves 404.html at any missing path, so relative asset URLs would break. The night palette
       (the same tokens as css/sumi.css, inlined): sumi ground, the silver grain, paper text, mono labels. -->
  <style>
    :root { --paper: #e9e7e2; --sumi: #141416; --deep: #0b0b0d; --dim: #bab8b3; --rule: rgba(233,231,226,.18); --rule-strong: rgba(233,231,226,.3);
      --serif: 'Shippori Mincho', 'Noto Serif JP', 'Yu Mincho', Georgia, serif; --mono: 'Share Tech Mono', ui-monospace, Menlo, Consolas, monospace; color-scheme: dark }
    * { margin: 0; padding: 0; box-sizing: border-box }
    html { background: var(--sumi) }
    /* the art over the words, the pair centred in the screen's height (so a tall tablet has no gap between them) */
    body { min-height: 100vh; min-height: 100svh; display: flex; flex-direction: column; justify-content: center; padding: 24px 0 40px;
      background: var(--sumi); color: var(--paper); font: 400 16px/1.6 var(--serif); -webkit-font-smoothing: antialiased; --gutter: clamp(16px, 6.7vw, 96px) }
    body::after { content: ""; position: fixed; inset: 0; pointer-events: none; z-index: 50; opacity: .10; background-size: 256px 256px;
      background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='256' height='256'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.8' numOctaves='3' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .914  0 0 0 0 .906  0 0 0 0 .886  2.2 0 0 0 -.6'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>") }
    a { color: inherit; text-decoration: none }
    :focus-visible { outline: 2px solid var(--paper); outline-offset: 3px }
    /* the torii: ascii-magic's sea-torii-sunset in mono paper dots at contrast 20, in the front page's fine screen (density 170, dot size 30: a
       print, not a dot-matrix sign), so the dusk sky keeps its dots and the gate (its top beam, its tie beam, both pillars) stands out of them as a
       sumi silhouette, the sun between the pillars. Drawn once and held (still) on every screen, so it costs nothing per frame. Sized to the viewport's width (an inline script sets the
       piece's font size: 192 columns x size x .602 px = 100vw); the frame shows the piece from the sky over the gate to the sea under the sun
       (.62 of its height; the piece is .563 x its width tall), its top and foot fading into the sumi. On a phone (<= 720) the piece is set at 96
       columns = 100vw, twice the width, centred, so the gate fills the width in 4 px cells. Decorative: aria-hidden. Holds its first frame under
       reduced motion (the engine does that itself). */
    /* the frame is capped by the screen's height (less the words' ~330 px), so the way back is always on the first screen; the art hangs from
       the frame's top, so a capped frame just shows less of the sea */
    .torii { --tf: linear-gradient(transparent 8%, #000 25%, #000 70%, transparent); --sf: linear-gradient(90deg, transparent, #000 10%, #000 90%, transparent);   /* the top fade starts where the art does (6 rows down), so no hard first row */
      position: relative; width: 100%; height: calc(100vw * .563 * .62); height: min(calc(100vw * .563 * .62), max(160px, calc(100vh - 330px)));
      height: min(calc(100vw * .563 * .62), max(160px, calc(100svh - 330px))); overflow: hidden; pointer-events: none; color: var(--paper); opacity: .9;
      -webkit-mask-image: var(--tf), var(--sf); -webkit-mask-composite: source-in;
      mask-image: var(--tf), var(--sf); mask-composite: intersect }   /* its top, foot and both sides fade into the sumi */
    .torii ascii-art { position: absolute; left: 0; top: calc(100vw / 192 * 6); display: block; width: 100vw; max-width: none; color: inherit }   /* 6 rows of sky over the gate: the kasagi's upturned ends clear the top fade */
    .torii ascii-art canvas { display: block }
    html.no-torii .torii { display: none }
    /* the words: straight on sumi under the art, on the gutter like a chapter of the front page, one hairline above */
    .msg { margin: 8px var(--gutter) 0; padding-top: 32px; border-top: 1px solid var(--rule); max-width: 960px }
    .kicker { font-family: var(--mono); font-size: 11px; letter-spacing: .22em; text-transform: uppercase; color: var(--dim) }
    h1 { font-weight: 400; font-size: 40px; line-height: 1.1; margin-top: 14px }
    p { color: var(--dim); margin-top: 16px; max-width: 46ch }
    .back { display: inline-block; margin-top: 16px; padding: 12px 0; font-family: var(--mono); font-size: 11px; letter-spacing: .22em; text-transform: uppercase; color: var(--paper) }
    .back:hover, .back:focus-visible { text-decoration: underline; text-underline-offset: 6px; text-decoration-thickness: 1px }
    @media (max-width: 720px) {
      .torii { height: calc(200vw * .563 * .62); height: min(calc(200vw * .563 * .62), max(160px, calc(100vh - 360px))); height: min(calc(200vw * .563 * .62), max(160px, calc(100svh - 360px))) }
      .torii { --sf: linear-gradient(90deg, transparent, #000 4%, #000 96%, transparent) }   /* the gate spans the phone: a narrow side fade keeps the kasagi's ends */
      .torii ascii-art { width: 200vw; max-width: none; left: -50vw; top: calc(200vw / 192 * 6) }
      h1 { font-size: 32px }
      body { justify-content: flex-start; padding-top: 32px }   /* the art starts near the top: a phone's first view never opens on bare sumi */
    }
  </style>
</head>
<body>
  <!-- the torii: a self-hosted ascii-magic piece (js/ascii/pieces/sea-torii-sunset.js) drawn by the self-hosted engine (js/ascii/ascii.js).
       The engine's URL must be absolute: this page is served at any missing path. On the live site the repo lives under /PortfolioWebsite/
       (https://wavy-hec.github.io/PortfolioWebsite/); served locally from the repo root it lives under /. The script below picks the order from
       where it runs and falls back to the other on a failed import, so both work; if neither loads, html.no-torii hides the empty slot. -->
  <div class="torii" aria-hidden="true"><ascii-art piece="sea-torii-sunset" look="dots" mono contrast="20" density="170" dot-size="30" still aria-hidden="true"></ascii-art></div>
  <script>
    (function () {
      var el = document.querySelector('.torii ascii-art');
      if (!el) return;
      var fit = function () { var phone = innerWidth <= 720; el.setAttribute('size', (innerWidth / ((phone ? 96 : 192) * 0.602)).toFixed(2)); };
      fit();
      // a print, as the front page's pagoda is: drawn once (the still attribute above) on every screen
      var rt; addEventListener('resize', function () { clearTimeout(rt); rt = setTimeout(fit, 200); }, { passive: true });
      var repo = /github\.io$/.test(location.hostname) || location.pathname.indexOf('/PortfolioWebsite/') === 0;
      var paths = repo ? ['/PortfolioWebsite/js/ascii/ascii.js?v=10', '/js/ascii/ascii.js?v=10'] : ['/js/ascii/ascii.js?v=10', '/PortfolioWebsite/js/ascii/ascii.js?v=10'];   // the same key as js/sumi.js: bump both together
      import(paths[0]).catch(function () { return import(paths[1]); }).catch(function () { document.documentElement.classList.add('no-torii'); });
    })();
  </script>
  <main class="msg">
    <p class="kicker">404 · page not found</p>
    <h1>Nothing stands here.</h1>
    <p>The link you followed points to a page that has moved or never existed. The front page has everything: the work, the experience, the papers.</p>
    <a class="back" href="https://wavy-hec.github.io/PortfolioWebsite/">← back to the front page</a>
  </main>
</body>
</html>
