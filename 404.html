<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#141416">
  <meta name="robots" content="noindex">
  <title>404 — Hector Lugo III</title>
  <!-- served at any path, so nothing here is relative: the seal is inline, the rest absolute -->
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cpath fill='%23e9e7e2' d='M32.4 2.2C48.6 1.3 62.6 14.6 62 31.4 61.5 47.9 49.2 61.4 32.6 62 16 62.6 2.2 49.4 2 32.8 1.8 16.6 16 3 32.4 2.2Z'/%3E%3Cpath fill='%23141416' d='M14.2 14.4 23 14 23.6 50.2 14.6 50.6ZM22 29.2 32.6 28.8 32.8 36 22.2 36.4ZM31.4 14.2 40.4 13.8 40.8 42.6 51.6 42.2 52 49.6 31.8 50.6Z'/%3E%3C/svg%3E">
  <link rel="icon" href="https://wavy-hec.github.io/PortfolioWebsite/favicon-32.png?v=7" type="image/png" sizes="32x32">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@400&family=Share+Tech+Mono&display=swap" media="print" onload="this.media='all'">
  <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@400&family=Share+Tech+Mono&display=swap"></noscript>
  <style>
    :root {
      --paper: #e9e7e2;
      --sumi: #141416;
      --dim: #bab8b3;
      --rule: rgba(233, 231, 226, 0.18);
      --serif: 'Shippori Mincho', 'Noto Serif JP', 'Yu Mincho', Georgia, serif;
      --mono: 'Share Tech Mono', ui-monospace, Menlo, Consolas, monospace;
      --gutter: clamp(16px, 6.7vw, 96px);
      color-scheme: dark;
    }
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    html {
      background: var(--sumi);
    }
    /* the ridge over the words, the pair centred in the screen's height */
    body {
      height: 100vh;
      height: 100svh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      justify-content: safe center;
      padding: 24px 0 40px;
      background: var(--sumi);
      color: var(--paper);
      font: 400 16px/1.6 var(--serif);
      -webkit-font-smoothing: antialiased;
    }
    body::after {
      content: '';
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 50;
      opacity: 0.1;
      background-size: 256px 256px;
      background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='256' height='256'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.8' numOctaves='3' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .914  0 0 0 0 .906  0 0 0 0 .886  2.2 0 0 0 -.6'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
    }
    a {
      color: inherit;
      text-decoration: none;
    }
    :focus-visible {
      outline: 2px solid var(--paper);
      outline-offset: 3px;
    }
    /* it gives up its height before the words do, so the way back stays on the first screen */
    .ridge {
      position: relative;
      flex: 0 1 calc(140px + 18vw);
      overflow: hidden;
      pointer-events: none;
      -webkit-mask-image: linear-gradient(#000 78%, transparent);
      mask-image: linear-gradient(#000 78%, transparent);
    }
    .ridge canvas {
      position: absolute;
      left: 0;
      width: 100%;
    }
    .ridge .mist {
      width: 200%;
    }
    .ridge::after {
      content: '';
      position: absolute;
      inset: 0;
      background: var(--sumi);
      transition: opacity 0.9s;
    }
    .ridge.painted::after {
      opacity: 0;
    }
    .msg {
      margin: 8px var(--gutter) 0;
      padding-top: 32px;
      border-top: 1px solid var(--rule);
    }
    .msg > * {
      max-width: 46ch;
    }
    .kicker {
      font-family: var(--mono);
      font-size: 11px;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: var(--dim);
    }
    h1 {
      font-weight: 400;
      font-size: 40px;
      line-height: 1.1;
      margin-top: 14px;
      text-wrap: balance;
    }
    p {
      color: var(--dim);
      margin-top: 16px;
    }
    .back {
      display: inline-block;
      margin-top: 16px;
      padding: 12px 0;
      font-family: var(--mono);
      font-size: 11px;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: var(--paper);
    }
    .back:hover,
    .back:focus-visible {
      text-decoration: underline;
      text-underline-offset: 6px;
      text-decoration-thickness: 1px;
    }
    /* a phone or a tall tablet starts from the top, not from bare sumi */
    @media (max-width: 720px) {
      body {
        justify-content: flex-start;
        padding-top: 32px;
      }
      h1 {
        font-size: 32px;
      }
    }
    @media (min-width: 721px) and (max-width: 1024px) and (orientation: portrait) {
      body {
        justify-content: flex-start;
        padding-top: 48px;
      }
    }
    @media (prefers-reduced-motion: reduce) {
      .ridge::after {
        transition: none;
      }
    }
    /* a phone on its side has room for the words only */
    @media (max-height: 440px) {
      body {
        padding: 16px 0;
      }
      .ridge {
        display: none;
      }
    }
    /* the front page's measure on large screens */
    @media (min-width: 1600px) {
      .msg {
        margin-left: calc(50% - 576px);
        margin-right: calc(50% - 576px);
      }
    }
  </style>
</head>
<body>
  <div class="ridge" aria-hidden="true" data-bare></div>
  <main class="msg">
    <p class="kicker">404 · page not found</p>
    <h1>Nothing stands here.</h1>
    <p>The link you followed points to a page that has moved or never existed. The front page has everything: the work, the experience, the papers.</p>
    <a class="back" href="https://wavy-hec.github.io/PortfolioWebsite/"><span aria-hidden="true">← </span>back to the front page</a>
  </main>
  <script src="https://wavy-hec.github.io/PortfolioWebsite/js/sumi-ridge.js?v=2" defer></script>
</body>
</html>
