<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <!--
    The link-preview card (img/og-card.png, 1200x630): the fold itself, as a still. This page frames the real front page (../index.html, same
    origin) at 1200x630 and, once it has loaded, dresses it for a card: no nav (the fold takes the whole height), no grain (it would triple the
    PNG), nothing below the fold; the line under the headline becomes the name and the degree (the footer's own wording) and the call to action
    becomes the address. Everything else is the page: the halftone moon, Raiden, the grass in a still gust, the fog (one still frame under
    reduced motion, js/sumi-fold.js), so the card never drifts from the fold.
    Rendered by headless Chrome at exactly 1200x630, reduced motion (the fold's still frame; no fade), served from the repo root:

      chrome --headless=new --disable-gpu --hide-scrollbars --force-prefers-reduced-motion --window-size=1200,630 --virtual-time-budget=8000 --screenshot=img/og-card.png http://127.0.0.1:8000/tools/og-card.html

    then convert to 8-bit grey (L: the card has no hue) and run oxipng -o4 --strip safe. Bump og-card.png?v= in index.html (og:image, twitter:image).
  -->
  <meta name="robots" content="noindex">
  <title>og card</title>
  <style>
    html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; background: #141416 }
    iframe { display: block; width: 1200px; height: 630px; border: 0 }
  </style>
</head>
<body>
  <iframe src="../index.html" title="the fold" scrolling="no"></iframe>
  <script>
    const f = document.querySelector('iframe');
    f.addEventListener('load', () => {
      const d = f.contentDocument;
      const st = d.createElement('style');
      st.textContent = `
        :root { --nav: 0px }
        .nav, .skip, main > :not(.hero), footer, #live-status { display: none !important }
        body::after { display: none }
        .hero .sub.og { margin-top: 30px; max-width: none; font-family: 'Share Tech Mono', monospace; font-size: 16px; letter-spacing: .24em; text-transform: uppercase; color: #e9e7e2 }
        .hero .cta.og { margin: 12px 0 0; padding: 0; font-size: 14px; letter-spacing: .14em; text-transform: none; color: #bab8b3 }`;
      d.head.appendChild(st);
      const sub = d.querySelector('.hero .sub'), cta = d.querySelector('.hero .cta');
      sub.className = 'sub og'; sub.textContent = 'Hector Lugo · M.S. CS (Dec 2026) · UTRGV';
      cta.className = 'link cta og'; cta.textContent = 'wavy-hec.github.io/PortfolioWebsite';
      f.contentWindow.dispatchEvent(new Event('resize'));
    });
  </script>
</body>
</html>
