<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <!--
    The link-preview card (img/og-card.png, 1200x630): the fold of the night page as a still. Sumi ground (no grain: it would triple the PNG), the two-line
    headline in Shippori Mincho, the name and the URL in mono, Raiden at the right as on the fold: the halftone moon behind his head (the fold's
    drawMoon, js/sumi-fold.js, at the same --mx / --my / --md), his shadow plate (../img/raiden-shade.png) under his paper plate (../img/raiden-night.png),
    his legs dissolving into the fog.
    Rendered by headless Chrome at exactly 1200x630 (served from the repo root so the fonts and the image resolve):

      chrome --headless=new --disable-gpu --hide-scrollbars --window-size=1200,630 --virtual-time-budget=4000 --screenshot=img/og-card.png http://127.0.0.1:8000/tools/og-card.html
    (the moon is drawn at its own 189 px, one dot per pixel: scaled down, a 320-dot screen beats into moire); save it as 8-bit grey (the card has no hue)

    then convert to 8-bit grey (L: a 64-colour palette banded the fog) and run oxipng -o4 --strip safe (the site's own tooling did this once; the card is static).
  -->
  <meta name="robots" content="noindex">
  <title>og card</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@400&family=Share+Tech+Mono&display=swap">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box }
    html, body { width: 1200px; height: 630px; overflow: hidden; background: #141416; color: #e9e7e2 }
    body { position: relative; font-family: 'Shippori Mincho', Georgia, serif; -webkit-font-smoothing: antialiased }
    .fog { position: absolute; inset: 0; background: linear-gradient(transparent 46%, rgba(233,231,226,.02) 60%, rgba(233,231,226,.05) 74%, rgba(233,231,226,.03) 88%, transparent 100%) }   /* the fold's fog: a ~5 % peak, smooth stops */
    .figure { position: absolute; right: -70px; bottom: 0; width: 378px; height: 600px }
    .figure img { position: absolute; left: 0; top: 0; height: 100%; width: auto; display: block }
    .figure img.shade { -webkit-mask-image: linear-gradient(#000 80%, transparent 90%); mask-image: linear-gradient(#000 80%, transparent 90%) }
    .figure canvas { position: absolute; left: calc(378px * .345 - 600px * .315 / 2); top: calc(600px * .19 - 600px * .315 / 2); width: calc(600px * .315); height: calc(600px * .315) }
    .copy { position: absolute; left: 80px; top: 150px }
    h1 { font-weight: 400; font-size: 82px; line-height: 1.04; letter-spacing: -.018em; text-shadow: 0 0 2px #141416, 0 0 12px #141416, 0 0 26px #141416 }
    .name { margin-top: 36px; font-family: 'Share Tech Mono', monospace; font-size: 16px; letter-spacing: .24em; text-transform: uppercase; color: #e9e7e2 }
    .url { margin-top: 12px; font-family: 'Share Tech Mono', monospace; font-size: 14px; letter-spacing: .14em; color: #bab8b3 }
    .mark { position: absolute; left: 80px; top: 60px; display: flex; align-items: center; gap: 16px; font-family: 'Share Tech Mono', monospace; font-size: 12px; letter-spacing: .3em; text-transform: uppercase; color: #bab8b3 }
    .mark svg { width: 40px; height: 40px }
  </style>
</head>
<body>
  <div class="fog"></div>
  <div class="figure"><canvas width="189" height="189"></canvas><img class="shade" src="../img/raiden-shade.png" width="640" height="1016" alt=""><img src="../img/raiden-night.png" width="640" height="1016" alt=""></div>
  <script>
    // the fold's moon (js/sumi-fold.js drawMoon): 6/16 of a Bayer 4x4 screen in paper, one dot per plate pixel, the limb pressed a little out of true
    (() => {
      const B = [0, 8, 2, 10, 12, 4, 14, 6, 3, 11, 1, 9, 15, 7, 13, 5], cv = document.querySelector('.figure canvas'), N = cv.width, g = cv.getContext('2d'), im = g.createImageData(N, N), px = im.data;
      let a = 1985 >>> 0; const r = () => { a = (a + 0x6D2B79F5) >>> 0; let t = a; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
      const ph = [r() * 6.2832, r() * 6.2832, r() * 6.2832], c = N / 2, R = N / 2 - 1;
      const wob = q => .7 * (.55 * Math.sin(3 * q + ph[0]) + .3 * Math.sin(5 * q + ph[1]) + .15 * Math.sin(8 * q + ph[2]));
      for (let y = 0; y < N; y++) for (let x = 0; x < N; x++) {
        const dx = x + .5 - c, dy = y + .5 - c;
        if (Math.hypot(dx, dy) > R + wob(Math.atan2(dy, dx)) || B[(y & 3) * 4 + (x & 3)] >= 6) continue;
        const i = (y * N + x) * 4; px[i] = 233; px[i + 1] = 231; px[i + 2] = 226; px[i + 3] = 255;
      }
      g.putImageData(im, 0, 0);
    })();
  </script>
  <div class="mark"><svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg"><path fill="#e9e7e2" d="M32.4 2.2C48.6 1.3 62.6 14.6 62 31.4 61.5 47.9 49.2 61.4 32.6 62 16 62.6 2.2 49.4 2 32.8 1.8 16.6 16 3 32.4 2.2Z"/><path fill="#141416" d="M14.2 14.4 23 14 23.6 50.2 14.6 50.6ZM22 29.2 32.6 28.8 32.8 36 22.2 36.4ZM31.4 14.2 40.4 13.8 40.8 42.6 51.6 42.2 52 49.6 31.8 50.6Z"/></svg><span>AI &amp; robotics researcher</span></div>
  <div class="copy">
    <h1>Teaching robots<br>to move, and to see.</h1>
    <p class="name">Hector Lugo · M.S. CS · UTRGV</p>
    <p class="url">wavy-hec.github.io/PortfolioWebsite</p>
  </div>
</body>
</html>
