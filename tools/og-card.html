<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <!--
    The link-preview card, img/og-card.png: the fold at 1200 x 630 with no nav, no grain and the name
    and address in place of the words under the headline. Screenshot this page at exactly 1200 x 630
    with reduced motion, save it as 8-bit grey, and bump og-card.png?v= in index.html.
  -->
  <meta name="robots" content="noindex">
  <title>og card</title>
  <style>
    html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; background: #141416 }
    iframe { display: block; width: 1200px; height: 630px; border: 0 }
  </style>
</head>
<body>
  <iframe src="../index.html" title="the fold" scrolling="no"></iframe>
  <script>
    const frame = document.querySelector('iframe');
    frame.addEventListener('load', () => {
      const d = frame.contentDocument;
      const style = d.createElement('style');
      style.textContent = `
        :root { --nav: 0px }
        .nav, .skip, footer, #live-status { display: none !important }
        body::after { display: none }
        .hero .sub.og { margin-top: 30px; max-width: none; min-height: 0; font-family: 'Share Tech Mono', monospace; font-size: 15px; letter-spacing: .2em; text-transform: uppercase; color: #e9e7e2 }
        .hero .ctas.og { margin-top: 12px; font-family: 'Share Tech Mono', monospace; font-size: 14px; letter-spacing: .14em; color: #bab8b3 }`;
      d.head.appendChild(style);
      // the chapters go, so the drawings that load later find nothing to draw
      d.querySelectorAll('main > :not(.hero)').forEach(el => el.remove());
      const sub = d.querySelector('.hero .sub');
      const ctas = d.querySelector('.hero .ctas');
      sub.className = 'sub og';
      sub.textContent = 'Hector Lugo · M.S. CS (expected Dec 2026) · UTRGV';
      ctas.className = 'ctas og';
      ctas.textContent = 'wavy-hec.github.io/PortfolioWebsite';
      d.querySelector('.hero .status').remove();
      frame.contentWindow.dispatchEvent(new Event('resize'));
    });
  </script>
</body>
</html>
