<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <!--
    The link-preview card (img/og-card.png, 1200x630): the fold of the night page as a still. Sumi ground (no grain: it would triple the PNG), the two-line
    headline in Shippori Mincho, the name and the URL in mono, Raiden (../img/raiden-night.png) at the right dissolving into the fog.
    Rendered by headless Chrome at exactly 1200x630 (served from the repo root so the fonts and the image resolve):

      chrome --headless=new --disable-gpu --hide-scrollbars --window-size=1200,630 --virtual-time-budget=4000 --screenshot=img/og-card.png http://127.0.0.1:8000/tools/og-card.html

    then quantize to 64 colours (max coverage, Floyd-Steinberg: fewer colours band the dissolve) and run oxipng -o4 --strip safe (the site's own tooling did this once; the card is static).
  -->
  <meta name="robots" content="noindex">
  <title>og card</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@400&family=Share+Tech+Mono&display=swap">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box }
    html, body { width: 1200px; height: 630px; overflow: hidden; background: #141416; color: #e9e7e2 }
    body { position: relative; font-family: 'Shippori Mincho', Georgia, serif; -webkit-font-smoothing: antialiased }
    .fog { position: absolute; inset: 0; background: linear-gradient(transparent 46%, rgba(233,231,226,.02) 60%, rgba(233,231,226,.05) 74%, rgba(233,231,226,.03) 88%, transparent 100%) }   /* the fold's fog: a ~5 % peak, smooth stops */
    .figure { position: absolute; right: -70px; bottom: 0; height: 600px; -webkit-mask-image: linear-gradient(#000 60%, transparent 98%); mask-image: linear-gradient(#000 60%, transparent 98%) }
    .figure img { height: 100%; width: auto; display: block }
    .copy { position: absolute; left: 80px; top: 150px }
    h1 { font-weight: 400; font-size: 82px; line-height: 1.04; letter-spacing: -.018em; text-shadow: 0 0 2px #141416, 0 0 12px #141416, 0 0 26px #141416 }
    .name { margin-top: 36px; font-family: 'Share Tech Mono', monospace; font-size: 16px; letter-spacing: .24em; text-transform: uppercase; color: #e9e7e2 }
    .url { margin-top: 12px; font-family: 'Share Tech Mono', monospace; font-size: 14px; letter-spacing: .14em; color: #bab8b3 }
    .mark { position: absolute; left: 80px; top: 60px; display: flex; align-items: center; gap: 16px; font-family: 'Share Tech Mono', monospace; font-size: 12px; letter-spacing: .3em; text-transform: uppercase; color: #bab8b3 }
    .mark svg { width: 40px; height: 40px }
  </style>
</head>
<body>
  <div class="fog"></div>
  <div class="figure"><img src="../img/raiden-night.png" width="640" height="1016" alt=""></div>
  <div class="mark"><svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg"><path fill="#e9e7e2" d="M32.4 2.2C48.6 1.3 62.6 14.6 62 31.4 61.5 47.9 49.2 61.4 32.6 62 16 62.6 2.2 49.4 2 32.8 1.8 16.6 16 3 32.4 2.2Z"/><path fill="#141416" d="M14.2 14.4 23 14 23.6 50.2 14.6 50.6ZM22 29.2 32.6 28.8 32.8 36 22.2 36.4ZM31.4 14.2 40.4 13.8 40.8 42.6 51.6 42.2 52 49.6 31.8 50.6Z"/></svg><span>AI researcher · robotics engineer</span></div>
  <div class="copy">
    <h1>Teaching robots<br>to move, and to see.</h1>
    <p class="name">Hector Lugo · MS CS · UTRGV</p>
    <p class="url">wavy-hec.github.io/PortfolioWebsite</p>
  </div>
</body>
</html>
