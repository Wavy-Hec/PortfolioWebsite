<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <!--
    Human-editable visual reference for img/og-card-ink.png (1200x630) — the Ink page as
    the link preview: paper with the site's faint dither grain, the black headline band,
    HECTOR in paper / LUGO in red, Raiden (../img/ink-raiden.png) crossing the band exactly
    like the hero, kicker + URL + credit in mono.

    The PNG itself is rendered by tools/make-og-card.py (Pillow, Georgia Bold + Consolas as
    system stand-ins for Spectral / Share Tech Mono; 64-colour PNG, ~90 KB). If Pillow is
    unavailable, open this page at exactly 1200x630 and screenshot it.
    Self-contained on purpose: system fonts only, no external requests, no site JS.
  -->
  <meta name="robots" content="noindex">
  <title>og card</title>
  <link rel="icon" href="../favicon.svg" type="image/svg+xml">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 1200px;
      height: 630px;
      overflow: hidden;
      position: relative;
      font-family: Georgia, 'Times New Roman', serif;
      background-color: #e9e7e2;
      background-image: radial-gradient(#d6d3cc 1px, transparent 1px);
      background-size: 8px 8px;
    }
    .band { position: absolute; left: 0; right: 0; top: 200px; height: 236px; background: #0d0d10; }
    .text { position: absolute; left: 80px; top: 150px; z-index: 1; }
    .kicker, .url, .credit, .cap { font-family: Consolas, 'Courier New', monospace; }
    .kicker { font-size: 22px; letter-spacing: 1px; color: #55585d; }
    h1 { font-size: 100px; font-weight: 700; line-height: 1.12; color: #f3f1ea; margin: 30px 0 0 -2px; }
    h1 span { color: #e04a52; }
    .url { margin-top: 26px; font-size: 22px; color: #55585d; }
    .credit { margin-top: 10px; font-size: 16px; color: #8c8982; }
    .figure { position: absolute; right: 100px; top: 14px; z-index: 1; text-align: center; }
    .figure img { display: block; height: 566px; width: auto; }
    .cap { font-size: 15px; letter-spacing: 1px; color: #55585d; margin-top: 10px; }
  </style>
</head>
<body>
  <div class="band"></div>
  <div class="text">
    <p class="kicker">// AI RESEARCHER · ROBOTICS ENGINEER</p>
    <h1>HECTOR<br><span>LUGO</span></h1>
    <p class="url">wavy-hec.github.io/PortfolioWebsite</p>
    <p class="credit">illustrations: Yoji Shinkawa</p>
  </div>
  <figure class="figure">
    <img src="../img/ink-raiden.png" alt="">
    <figcaption class="cap">RAIDEN · MGS2 · 140.85</figcaption>
  </figure>
</body>
</html>
